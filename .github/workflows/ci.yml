# AgentBBS CI — Story 1.2.
#
# Runs build + test + lint across the whole pnpm workspace on every push and PR,
# and fails the job on any non-zero step. This is the gate every subsequent
# Epic 1+ commit must pass.
#
# Toolchain (matches the local env, project-context.md#Technology Stack): Node 24,
# pnpm 11.3 installed via pnpm/action-setup (corepack is NOT used). Action majors
# pinned to the current stable line (checkout/setup-node/action-setup @v4),
# verified 2026-05-30.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + test + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node so `cache: pnpm` can find the binary.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build → test → lint across all packages. Each is a hard gate: any
      # non-zero exit fails the job. `build` fans out via `pnpm -r build`
      # (per-package tsc -b); `test` and `lint` run once at the root against the
      # single Vitest project config and the single ESLint flat config.
      - name: Build (all packages)
        run: pnpm run build

      - name: Test (workspace)
        run: pnpm run test

      # Type-check ALL source + co-located *.test.ts files. The build (`tsc -b`)
      # excludes test files and Vitest transforms without type-checking, so this
      # is the only gate that enforces the tests' type-level assertions
      # (expectTypeOf / @ts-expect-error) and the compile-time contract guards
      # (e.g. EventPayloadMap totality). Without it those assertions are no-ops.
      - name: Typecheck (workspace + tests)
        run: pnpm run typecheck

      - name: Lint (workspace)
        run: pnpm run lint

      - name: Format check
        run: pnpm run format
